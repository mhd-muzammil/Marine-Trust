        <h1>Marine Biodiversity Conservation Trust (MBCT)</h1>
        <p>MBCT is a registered non-profit charitable trust dedicated to protecting marine life, coral reefs, coastal ecosystems, and ocean biodiversity. Based in Chengalpattu, Tamil Nadu, India, we work through research, education, beach cleanups, mangrove restoration, and community-driven conservation programs.</p>

        <h2>Our Mission</h2>
        <p>To conserve and restore marine biodiversity through scientific research, community engagement, and sustainable practices — ensuring healthy oceans for future generations.</p>

        <h2>What We Do</h2>
        <ul>
          <li><strong>Awareness &amp; Education</strong> — Programs in schools, colleges, and communities</li>
          <li><strong>Beach Cleanups</strong> — Organized coastal cleanup and restoration activities</li>
          <li><strong>Mangrove Restoration</strong> — Environmental rehabilitation and youth training</li>
          <li><strong>Research &amp; Monitoring</strong> — Scientific marine ecosystem research</li>
          <li><strong>Partnerships</strong> — Collaborations with governments, NGOs, and institutions</li>
        </ul>
